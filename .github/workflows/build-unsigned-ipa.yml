name: Build Unsigned IPA for SideStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    - name: Build Swift Package App Backend
      run: |
        swift build -c release \
          --triple arm64-apple-ios18.0 \
          --sdk $(xcrun --sdk iphoneos --show-sdk-path)

    - name: Pack Unsigned .app into IPA Structure
      run: |
        mkdir -p build/Payload
        mkdir -p build/Payload/LLMTokenSaver.app
        
        # Умный поиск скомпилированного бинарного файла в недрах папки .build
        echo "Ищем скомпилированный файл..."
        BINARY_PATH=$(find .build -type f -name "LLMTokenSaver" -not -path "*/plugins/*" | head -n 1)
        
        if [ -n "$BINARY_PATH" ]; then
          echo "Файл найден по пути: $BINARY_PATH"
          cp "$BINARY_PATH" build/Payload/LLMTokenSaver.app/LLMTokenSaver
        else
          echo "Критическая ошибка: бинарный файл не найден!"
          exit 1
        fi
        
        # Создаем Info.plist конфигурацию
        echo '<?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>LLMTokenSaver</string>
            <key>CFBundleIdentifier</key>
            <string>com.tokensaver.llmtokensaver</string>
            <key>CFBundleName</key>
            <string>LLMTokenSaver</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>18.0</string>
        </dict>
        </plist>' > build/Payload/LLMTokenSaver.app/Info.plist

        # Упаковываем в IPA
        cd build
        zip -r LLMTokenSaver-unsigned.ipa Payload
        
    - name: Upload Unsigned IPA to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LLMTokenSaver-SideStore-Ready
        path: build/LLMTokenSaver-unsigned.ipa
        retention-days: 7
