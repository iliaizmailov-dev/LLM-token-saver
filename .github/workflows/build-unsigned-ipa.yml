name: Build Unsigned IPA for SideStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    - name: Clean Environment
      run: |
        # Полностью вычищаем временные контейнеры сборщика перед стартом
        rm -rf .build
        rm -rf build

    - name: Resolve Swift Package Dependencies
      run: |
        # Прямой запуск загрузки пакетов по обновленному манифесту
        swift package resolve

    - name: Build and Archive iOS App
      run: |
        # Компилируем исполняемый файл приложения
        xcodebuild archive \
          -scheme LLMTokenSaver \
          -destination 'generic/platform=iOS' \
          -archivePath build/LLMTokenSaver.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Pack Unsigned .app into IPA Structure
      run: |
        mkdir -p build/Payload
        
        APP_PATH="build/LLMTokenSaver.xcarchive/Products/Applications/LLMTokenSaver.app"
        
        if [ -d "$APP_PATH" ]; then
          echo "Приложение успешно извлечено из архива."
          cp -R "$APP_PATH" build/Payload/
        else
          FOUND_APP=$(find build/LLMTokenSaver.xcarchive -type d -name "*.app" | head -n 1)
          if [ -n "$FOUND_APP" ]; then
            cp -R "$FOUND_APP" build/Payload/
          else
            echo "Критическая ошибка: Скомпилированный .app контейнер не найден в архиве!"
            exit 1
          fi
        fi
        
        cd build
        zip -r LLMTokenSaver-unsigned.ipa Payload
        
    - name: Upload Unsigned IPA to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LLMTokenSaver-SideStore-Ready
        path: build/LLMTokenSaver-unsigned.ipa
        retention-days: 7
