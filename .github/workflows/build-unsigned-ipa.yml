name: Build Unsigned IPA for SideStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную одной кнопкой

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    - name: Fix SwiftPM Git URL Resolution
      run: |
        # Принудительно подменяем ошибочный коренной URL-адрес на валидный репозиторий библиотеки
        git config --global url."https://github.com".insteadOf "https://github.com"
        
        # Отключаем системный кэш репозиториев на уровне окружения SwiftPM
        defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltInSCM YES

    - name: Resolve Swift Package Dependencies
      run: |
        # Теперь вызов пройдет без обращения к сломанному кэшу контейнера
        swift package resolve

    - name: Build and Archive iOS App
      run: |
        # Компилируем исполняемый файл приложения графического интерфейса
        xcodebuild archive \
          -scheme LLMTokenSaver \
          -destination 'generic/platform=iOS' \
          -archivePath build/LLMTokenSaver.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Pack Unsigned .app into IPA Structure
      run: |
        mkdir -p build/Payload
        
        # Извлекаем скомпилированное приложение прямо из созданного Apple архива
        APP_PATH="build/LLMTokenSaver.xcarchive/Products/Applications/LLMTokenSaver.app"
        
        if [ -d "$APP_PATH" ]; then
          echo "Приложение успешно извлечено из архива."
          cp -R "$APP_PATH" build/Payload/
        else
          # Фолбэк на случай альтернативной структуры папок xcodebuild
          FOUND_APP=$(find build/LLMTokenSaver.xcarchive -type d -name "*.app" | head -n 1)
          if [ -n "$FOUND_APP" ]; then
            cp -R "$FOUND_APP" build/Payload/
          else
            echo "Критическая ошибка: Скомпилированный .app контейнер не найден в архиве!"
            exit 1
          fi
        fi
        
        # Создаем Info.plist конфигурацию (если xcodebuild не создал её автоматически)
        if [ ! -f build/Payload/LLMTokenSaver.app/Info.plist ]; then
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>LLMTokenSaver</string>
              <key>CFBundleIdentifier</key>
              <string>com.tokensaver.llmtokensaver</string>
              <key>CFBundleName</key>
              <string>LLMTokenSaver</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>18.0</string>
          </dict>
          </plist>' > build/Payload/LLMTokenSaver.app/Info.plist
        fi

        # Упаковываем структуру Payload в .ipa архив
        cd build
        zip -r LLMTokenSaver-unsigned.ipa Payload
        
    - name: Upload Unsigned IPA to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LLMTokenSaver-SideStore-Ready
        path: build/LLMTokenSaver-unsigned.ipa
        retention-days: 7
