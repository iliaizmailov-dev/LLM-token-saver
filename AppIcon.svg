    <rect x="78" y="78" width="868" height="868" rx="180" fill="#F5F5F5"/>
  </g>

  <g fill="#1D1D1F" font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="512" y="430" text-anchor="middle" font-size="210">TOKEN</text>
    <text x="512" y="670" text-anchor="middle" font-size="210">SAVER</text>
  </g>
</svg>
