name: LLMTokenSaver

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

targets:
  LLMTokenSaver:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    sources:
      - path: Sources/LLMTokenSaver

    resources:
      - path: AppIcon.appiconset

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iliaizmailov.LLMTokenSaver
        PRODUCT_NAME: LLMTokenSaver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LLM Token Saver"
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  LLMTokenSaver:
    build:
      targets:
        LLMTokenSaver: all

    run:
      config: Debug

    archive:
      config: Release
